<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Confirm Redirect | Weer</title>
    <link
      rel="icon"
      type="image/png"
      href="/favicons/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicons/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <link
      href="https://fonts.googleapis.com/css?family=Lato:100,300,300i,400,500,700"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/font-awesome/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="has-fixed-nav">
    <div>
      <nav class="navigation">
        <a href="/" class="navigation__logo">
          <img src="/logo.svg" alt="Weer Logo" />
          <span>Weer</span>
        </a>
      </nav>

      <main class="redirect-warning-container">
        <div class="redirect-warning-card">
          <p class="redirect-warning-card__lede" id="lede">
            You are about to open the following link:
          </p>
          <span id="destination" class="redirect-warning-card__destination"
            ><div class="lds-ellipsis">
              <div class="lds-ellipsis--light"></div>
              <div class="lds-ellipsis--light"></div>
              <div class="lds-ellipsis--light"></div>
              <div class="lds-ellipsis--light"></div></div
          ></span>
          <p class="redirect-warning-card__sub" id="message">
            You will be automatically redirected to the link above in
            <span id="countdown">8</span>s&hellip;
          </p>
          <div class="redirect-warning-card__actions" id="actions">
            <button
              type="button"
              id="cancel-btn"
              class="button button-red-outlined button-rounded"
            >
              Cancel<i class="fa-solid fa-xmark button__icon-right"></i>
            </button>
            <a
              id="continue-link"
              class="button button-blue button-rounded"
              rel="nofollow noopener noreferrer"
              >Open link now<i
                class="fa-solid fa-arrow-right button__icon-right"
              ></i
            ></a>
          </div>
        </div>
      </main>
    </div>

    <script>
      (async () => {
        const ledeEl = document.getElementById("lede");
        const destinationEl = document.getElementById("destination");
        const messageEl = document.getElementById("message");
        const countdownEl = document.getElementById("countdown");
        const actionsEl = document.getElementById("actions");
        const continueLink = document.getElementById("continue-link");
        const cancelBtn = document.getElementById("cancel-btn");

        let realUrl = "";
        try {
          const res = await fetch("/redirect-warning/data" + location.search);
          const data = await res.json();
          realUrl = data.realUrl || "";
        } catch (e) {
          realUrl = "";
        }

        if (!realUrl) {
          ledeEl.textContent = "Link not found";
          destinationEl.textContent =
            "This link could not be found or is no longer available.";
          messageEl.remove();
          actionsEl.remove();
        } else {
          destinationEl.textContent = realUrl;
          continueLink.href = realUrl;

          const COUNTDOWN_SECONDS = 8;
          let secondsLeft = COUNTDOWN_SECONDS;
          countdownEl.textContent = secondsLeft;

          const timer = setInterval(() => {
            secondsLeft -= 1;

            if (secondsLeft <= 0) {
              clearInterval(timer);
              window.location.href = realUrl;
            } else {
              countdownEl.textContent = secondsLeft;
            }
          }, 1000);

          cancelBtn.addEventListener("click", () => {
            clearInterval(timer);

            messageEl.textContent = "Want to still open the link above?";
            actionsEl.innerHTML = "";

            const closeBtn = document.createElement("button");
            closeBtn.type = "button";
            closeBtn.className = "button button-red-outlined button-rounded";
            closeBtn.innerHTML =
              'Close<i class="fa-solid fa-xmark button__icon-right"></i>';
            closeBtn.addEventListener("click", () => {
              window.close();

              // Go to home page if page cannot be closed
              setTimeout(() => {
                window.location.href = "/";
              }, 300);
            });

            const goLink = document.createElement("a");
            goLink.className = "button button-blue button-rounded";
            goLink.rel = "noopener noreferrer";
            goLink.href = realUrl;
            goLink.innerHTML =
              'Go to link<i class="fa-solid fa-arrow-right button__icon-right"></i>';

            actionsEl.appendChild(closeBtn);
            actionsEl.appendChild(goLink);
          });
        }
      })();
    </script>
  </body>
</html>
